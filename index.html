<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14161a">
<link rel="icon" href="data:,">
<title>AR Statue App</title>
<script src="vendor/jsfeat-min.js"></script>
<script type="module" src="vendor/model-viewer.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HOME -->
<section id="home" class="screen active">
  <header><h1>AR STATUE APP</h1><p class="sub">Life-size stone statue · 1.8 m tall</p></header>
  <model-viewer id="mv" src="statue.glb" ios-src="statue.usdz" alt="Life-size stone statue on a plinth"
    camera-controls touch-action="pan-y" camera-orbit="30deg 75deg 4.2m" shadow-intensity="1" shadow-softness="0.8"
    exposure="1.05" environment-image="neutral"></model-viewer>
  <div class="panel">
    <ol class="gates">
      <li id="g1"><span class="dot"></span><b>Gate 1 · Device</b><small id="g1t">AR + camera check</small></li>
      <li id="g2"><span class="dot"></span><b>Gate 2 · Room</b><small id="g2t">Recognize this room</small></li>
      <li id="g3"><span class="dot"></span><b>Statue corner</b><small id="g3t">Not marked yet</small></li>
    </ol>
    <button id="startBtn" class="big">Start</button>
    <div class="row">
      <button id="remarkBtn" class="ghost" hidden>Re-mark corner</button>
      <button id="forgetBtn" class="ghost small" hidden>Forget saved rooms</button>
    </div>
    <p class="msg" id="homeMsg"></p>
  </div>
</section>

<!-- CAMERA (room setup / recognition / corner capture / corner guide) -->
<section id="cam" class="screen">
  <div class="camwrap">
    <video id="video" playsinline muted autoplay></video>
    <div class="frame"></div>
    <img id="thumb" class="thumb" alt="Saved corner" hidden>
  </div>
  <div class="panel">
    <h2 id="camTitle">…</h2>
    <p id="camText" class="hint"></p>
    <input id="roomName" type="text" placeholder="Room name (e.g. Living room)" hidden>
    <div id="meterWrap" class="meter" hidden><div id="meter"></div><span id="meterTxt"></span></div>
    <button id="camPrimary" class="big">…</button>
    <div class="row">
      <button id="camAlt" class="ghost" hidden></button>
      <button id="camAlt2" class="ghost" hidden></button>
      <button id="camBack" class="ghost">Back</button>
    </div>
  </div>
</section>

<!-- WebXR DOM overlay (Android) -->
<div id="xr-overlay" hidden>
  <p id="xrStatus">Starting AR…</p>
  <div class="xrbtns">
    <button id="xrPlace" class="big">Place Statue Here</button>
    <button id="xrExit" class="ghost">Exit AR</button>
  </div>
</div>

<button id="playAgain" class="floating" hidden>▶ Play activation</button>
<script type="module" src="src/app.js"></script>
</body>
</html>
